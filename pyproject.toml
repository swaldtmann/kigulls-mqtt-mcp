[project]
name = "kigulls-mqtt-mcp"
version = "0.3.1"
description = "MCP Server fuer MQTT — publish und receive via WebSocket"
requires-python = ">=3.11"
dependencies = [
    "paho-mqtt>=2.0",
    "mcp[cli]>=1.0",
]

[project.scripts]
kigulls-mqtt-mcp = "kigulls_mqtt_mcp:main"
kigulls-mqtt-channel = "kigulls_mqtt_mcp.channel_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kigulls_mqtt_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "pre-commit>=3.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.coverage.run]
source = ["src"]
